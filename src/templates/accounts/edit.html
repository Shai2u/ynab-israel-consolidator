<!DOCTYPE html>
<html>
<head>
    <title>Edit {{ account.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Recon</a>
            <div>
                <a class="nav-link d-inline text-white" href="/accounts/">Accounts</a>
                <a class="nav-link d-inline text-white" href="/identity/">Identity</a>
                <a class="nav-link d-inline text-white" href="/consolidation/">Consolidation</a>
                <a class="nav-link d-inline text-white" href="/consolidation/results/">Results</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="d-flex align-items-center gap-3 mb-4">
            <h1 class="mb-0">Edit {{ account.name }}</h1>
            <a href="{% url 'account_detail' account.id %}" class="btn btn-link btn-sm">← Cancel</a>
        </div>

        <form method="post" class="col-md-6">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</body>
</html>
