
<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Recon</a>
            <div>
                <a class="nav-link d-inline text-white" href="/accounts/">Accounts</a>
                <a class="nav-link d-inline text-white" href="/identity/">Identity</a>
                <a class="nav-link d-inline text-white" href="/consolidation/">Consolidation</a>
                <a class="nav-link d-inline text-white" href="/consolidation/results/">Results</a>
            </div>
        </div>
    </nav>
    <div class="container-fluid mt-4">
        <h1>Results</h1>
        <form id="results-form" class="row g-3 mt-2 mb-4">
            {% csrf_token %}
            <div class="col-auto">
                <input type="date" name="start_date" class="form-control" required>
            </div>
            <div class="col-auto">
                <input type="date" name="end_date" class="form-control" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Load</button>
            </div>
        </form>
        <div id="results-table"></div>
    </div>

    <script>
        const table = new Tabulator("#results-table", {
            layout: "fitColumns",
            pagination: "local",
            paginationSize: 50,
            columns: [
                {title: "Date",         field: "Date",         sorter: "string", width: 110},
                {title: "Payee",        field: "Payee",        sorter: "string"},
                {title: "Account",      field: "Account",      sorter: "string", width: 150},
                {title: "Inflow",       field: "Inflow",       sorter: "number", width: 100, hozAlign: "right"},
                {title: "Outflow",      field: "Outflow",      sorter: "number", width: 100, hozAlign: "right"},
                {title: "Source",       field: "source_type",  sorter: "string", width: 100},
                {title: "Match Status", field: "match_status", sorter: "string", width: 120},
                {title: "Match Level",  field: "match_level",  sorter: "string", width: 120},
            ],
        });

        document.getElementById("results-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const data = new FormData(this);
            fetch("/consolidation/results/", {
                method: "POST",
                body: data,
            })
            .then(r => r.json())
            .then(json => {
                if (json.error) { alert(json.error); return; }
                table.setData(json.rows);
            });
        });
    </script>
</body>
</html>
